name: Verify V2.1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: training_v21_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:

      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Keep PostgreSQL mode out of the local PGlite fixtures.
      - run: npm run test:postgres
        env:
          TEST_POSTGRES_URL: postgresql://postgres:isolated-ci@localhost:5432/training_v21_test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
