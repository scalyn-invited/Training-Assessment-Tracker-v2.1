name: Verify platform UI
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [overview, shell, clients, history, accounts, accounts-mock, people, audit, settings]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers
      OVERVIEW_QA_SUITE: ${{ matrix.suite }}
      CLIENTS_QA_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: matrix.suite == 'overview' || matrix.suite == 'shell'
        run: npx playwright test --config playwright.overview.config.ts
      - if: matrix.suite != 'overview' && matrix.suite != 'shell'
        run: npx playwright test --config playwright.clients.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-ui-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
            output/playwright/
          retention-days: 14
